services:
  backend:
    build: .
    container_name: splitshot-backend
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+asyncpg://splitshot:splitshot@db:5432/splitshot}
      TEST_DATABASE_URL: ${BACKEND_TEST_DATABASE_URL:-postgresql+asyncpg://splitshot:splitshot@db:5432/splitshot_test}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: splitshot-db
    environment:
      POSTGRES_USER: splitshot
      POSTGRES_PASSWORD: splitshot
      POSTGRES_DB: splitshot
      POSTGRES_MULTIPLE_DATABASES: splitshot_test
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitshot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
