name: LLM Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  llm-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect PR data
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number, per_page: 100 }
            );

            const changedFiles = files.map(f => ({
              filename: f.filename,
              status: f.status,
              additions: f.additions,
              deletions: f.deletions,
              changes: f.changes,
              patch: f.patch || ""
            }));

            const commitMessages = commits.map(c => ({
              sha: c.sha,
              message: c.commit.message
            }));

            const body = pr.body || "";
            const issueMatch = body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            let linkedIssue = null;

            if (issueMatch) {
              const issue_number = Number(issueMatch[1]);
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number
              });
              linkedIssue = {
                number: issue.data.number,
                title: issue.data.title,
                body: issue.data.body || ""
              };
            }

            const payload = {
              pr: {
                number: pr.number,
                title: pr.title,
                body: pr.body || "",
                base: pr.base.ref,
                head: pr.head.ref
              },
              linkedIssue,
              commits: commitMessages,
              files: changedFiles
            };

            core.setOutput("review_payload", JSON.stringify(payload));

      - name: Ask LLM
        id: llm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_PAYLOAD: ${{ steps.collect.outputs.review_payload }}
        run: |
          cat > review.js <<'EOF'
          const fs = require("fs");

          async function main() {
            const payload = JSON.parse(process.env.REVIEW_PAYLOAD);

            const systemPrompt = `
            You are a strict senior reviewer.
            Review the pull request against the linked issue.
            Focus on:
            1. Whether the implementation matches the issue/task
            2. Potential bugs
            3. Edge cases
            4. Code quality and maintainability
            5. Security/performance concerns if visible
            6. Missing tests or weak validation

            Return concise markdown in Russian with sections:

            ## Итог
            one-paragraph summary

            ## Что хорошо
            bullet list

            ## Замечания
            bullet list

            ## Риски
            bullet list

            ## Вердикт
            one of:
            - OK
            - OK with comments
            - Needs changes
            `;

            const userPrompt = `
            Проведи нейроревью PR.

            PR:
            ${JSON.stringify(payload.pr, null, 2)}

            LINKED ISSUE:
            ${JSON.stringify(payload.linkedIssue, null, 2)}

            COMMITS:
            ${JSON.stringify(payload.commits, null, 2)}

            FILE CHANGES:
            ${JSON.stringify(payload.files, null, 2)}
            `;

            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.OPENROUTER_API_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model: "openrouter/free",
                messages: [
                  { role: "system", content: systemPrompt },
                  { role: "user", content: userPrompt }
                ],
                temperature: 0.2
              })
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(`OpenRouter error: ${res.status} ${text}`);
            }

            const data = await res.json();
            const content = data.choices?.[0]?.message?.content || "LLM did not return content";

            fs.writeFileSync("review.md", content, "utf8");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `review_file=review.md\n`);
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node review.js

      - name: Publish review to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("review.md", "utf8");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `## Автоматическое нейроревью\n\n${body}`
            });

      - name: Publish review to linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("review.md", "utf8");
            const prBody = context.payload.pull_request.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueMatch = prBody.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!issueMatch) {
              core.info("No linked issue found");
              return;
            }

            const issue_number = Number(issueMatch[1]);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `## Нейроревью для PR #${context.payload.pull_request.number}\n\n${body}`
            });