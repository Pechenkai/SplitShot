name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splitshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d splitshot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/splitshot
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/splitshot_test
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check app tests

      - name: Run linter
        run: ruff check app tests

      - name: Build Python package
        run: python -m build

      - name: Create test database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'splitshot_test'" | grep -q 1 \
            || psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE splitshot_test;"

      - name: Run migrations
        run: |
          alembic upgrade head
          alembic current

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: splitshot-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test backend image
        run: |
          docker run -d --rm \
            --name splitshot-backend-ci \
            -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/splitshot \
            splitshot-backend:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              docker stop splitshot-backend-ci
              exit 0
            fi
            sleep 1
          done
          docker logs splitshot-backend-ci
          docker stop splitshot-backend-ci
          exit 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "Deployment is enabled, but provider-specific deploy commands are not configured yet."
          echo "Add SSH, registry, or hosting provider steps here and store credentials in GitHub Secrets."
