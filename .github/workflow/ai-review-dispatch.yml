name: ai-review-dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dispatch-to-n8n:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Send PR event to n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_SHARED_SECRET: ${{ secrets.N8N_SHARED_SECRET }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          with open(os.environ["EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          payload = {
              "shared_secret": os.environ["N8N_SHARED_SECRET"],
              "event_name": os.environ["EVENT_NAME"],
              "repository": os.environ["REPO"],
              "sha": os.environ["SHA"],
              "action": event.get("action"),
              "pull_request": {
                  "number": event["pull_request"]["number"],
                  "title": event["pull_request"]["title"],
                  "body": event["pull_request"].get("body") or "",
                  "html_url": event["pull_request"]["html_url"],
                  "head_sha": event["pull_request"]["head"]["sha"],
                  "base_ref": event["pull_request"]["base"]["ref"],
                  "head_ref": event["pull_request"]["head"]["ref"],
              },
              "sender": event.get("sender", {}),
          }

          req = urllib.request.Request(
              os.environ["N8N_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req) as resp:
              print(resp.status)
              print(resp.read().decode("utf-8"))
          PY